# 엑스박스 컨트롤러 → /cmd_vel 텔레옵 (teleop_twist_joy 설정, 스톡 xbox.config.yaml 기반)
# LT(데드맨) 누른 동안만 퍼블리시. 스케일은 핑키에 맞게 축소 — 부스에서 실측 튜닝할 것.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:  # 왼쪽 스틱 상하
      x: 1
    scale_linear:
      x: 0.25
    scale_linear_turbo:
      x: 0.5

    axis_angular:  # 왼쪽 스틱 좌우
      yaw: 0
    scale_angular:
      yaw: 0.8

    enable_button: 2        # LT — 데드맨(안전): 놓으면 정지
    enable_turbo_button: 5  # RT — 터보
